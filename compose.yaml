x-app-environment: &app-environment
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-tg_promo}
  DB_USERNAME: ${DB_USERNAME:-tg_promo}
  DB_PASSWORD: ${DB_PASSWORD:-tg_promo}
  QUEUE_CONNECTION: database
  DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-180}
  QUEUE_FAILED_DRIVER: database-uuids
  CACHE_STORE: database
  SESSION_DRIVER: database
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
  TELEGRAM_CONNECT_TIMEOUT: ${TELEGRAM_CONNECT_TIMEOUT:-5}
  TELEGRAM_TIMEOUT: ${TELEGRAM_TIMEOUT:-30}

  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_ENDPOINT: ${LLM_ENDPOINT:-https://api.openai.com/v1/chat/completions}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_RESPONSE_FORMAT: ${LLM_RESPONSE_FORMAT:-json_object}
  LLM_CONNECT_TIMEOUT: ${LLM_CONNECT_TIMEOUT:-5}
  LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
  LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
  LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-5}
  LLM_REQUESTS_PER_DAY: ${LLM_REQUESTS_PER_DAY:-50}
  LLM_RETRY_BACKOFF: ${LLM_RETRY_BACKOFF:-5,15,30}

  TICKET_AUTO_CLOSE_HOURS: ${TICKET_AUTO_CLOSE_HOURS:-24}
  OPERATOR_EMAIL: ${OPERATOR_EMAIL:?Set OPERATOR_EMAIL in .env before starting}
  OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:?Set OPERATOR_PASSWORD in .env before starting}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tg_promo}
      POSTGRES_USER: ${DB_USERNAME:-tg_promo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tg_promo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
    command: ["sh", "-c", "php artisan migrate --force --no-interaction && php artisan db:seed --force --no-interaction && php artisan serve --host=0.0.0.0 --port=8000"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-environment
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "8000:8000"

  queue: &queue-worker
    build:
      context: .
    command: ["php", "artisan", "queue:work", "database", "--queue=ai,default", "--sleep=1", "--tries=3", "--timeout=150"]
    depends_on:
      app:
        condition: service_healthy
    environment: *app-environment
    restart: unless-stopped

  queue-telegram:
    <<: *queue-worker
    command: ["php", "artisan", "queue:work", "database", "--queue=telegram", "--sleep=1", "--tries=3", "--timeout=90"]

  queue-maintenance:
    <<: *queue-worker
    command: ["php", "artisan", "queue:work", "database", "--queue=maintenance", "--sleep=1", "--tries=3", "--timeout=90"]

volumes:
  postgres-data:
